[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Keep CI focused on errors that can affect execution. Prompt strings are
# intentionally long in places, so stylistic wrapping is not enforced here.
select = ["E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
